# Small synthetic smoke test for stage 2 (restoration / joint fine-tuning)
code_dim: 16
base_channels: 26
num_scales: 3
weather_code: continuous
freeze_translator: false
routing: soft
image_size: 64
batch_size: 4
lr: 1.0e-3
epochs_restoration: 20
l1_weight: 1.0
contrastive_weight: 0.75
use_vgg_loss: false
data_root: "data/synthetic/restoration"
val_split: 0.25
checkpoint_every: 10
